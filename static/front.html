<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>SLSU-JGE Login</title> 
<style> 
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; } 
  body { height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #00b37e 0%, #00d4aa 50%, #b8ffb9 100%); } 
  .login-container { width: 350px; padding: 40px 30px; text-align: center; } 
  .title { font-size: 32px; font-weight: 800; color: #fff; letter-spacing: 4px; margin-bottom: 40px; text-shadow: 0 3px 10px rgba(0,0,0,0.2); } 
  .input-box { position: relative; margin-bottom: 20px; } 
  .input-box input { width: 100%; padding: 15px 15px 15px 45px; border: none; border-radius: 50px; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); color: #fff; font-size: 15px; outline: none; } 
  .input-box input::placeholder { color: rgba(255,255,255,0.8); } 
  .input-box svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2; } 
  .options { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin: 15px 5px 25px; color: #fff; } 
  .remember { display: flex; align-items: center; gap: 6px; } 
  .remember input[type="checkbox"] { accent-color: #fff; width: 16px; height: 16px; } 
  .forgot { color: #004d40; text-decoration: none; font-weight: 500; } 
  .btn-login { width: 100%; padding: 14px; border: none; border-radius: 50px; background: #fff; color: #00a67e; font-size: 16px; font-weight: 700; letter-spacing: 2px; cursor: pointer; transition: 0.3s; } 
  .btn-login:hover { background: #f1f1f1; transform: translateY(-2px); } 
</style> 
</head> 
<body> 
  <div class="login-container"> 
    <h1 class="title">SLSU-JGE</h1> 

    <form action="/login" method="POST">
      <div class="input-box"> 
        <svg viewBox="0 0 24 24"> 
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/> 
          <circle cx="12" cy="7" r="4"/> 
        </svg> 
        <input type="text" name="username" placeholder="Username" required> 
      </div> 

      <div class="input-box"> 
        <svg viewBox="0 0 24 24"> 
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/> 
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/> 
        </svg> 
        <input type="password" name="password" placeholder="Password" required> 
      </div> 

      <div class="options"> 
        <label class="remember"> 
          <input type="checkbox" name="remember"> 
          Remember Me 
        </label> 
        <a href="#" class="forgot">Forgot Password?</a> 
      </div> 

      <button type="submit" class="btn-login">LOGIN</button>
    </form>
  </div> 
</body> 
</html>
